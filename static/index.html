<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Support Agent</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  .chat-header {
    padding: 20px 24px;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-header .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .chat-header .info h2 {
    margin: 0;
    color: white;
    font-size: 16px;
  }

  .chat-header .info p {
    margin: 2px 0 0;
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
  }

  #chat-box {
    height: 420px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #chat-box::-webkit-scrollbar { width: 6px; }
  #chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

  .msg-row {
    display: flex;
    gap: 8px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .user .bubble {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #05261e;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }

  .agent .bubble {
    background: rgba(255, 255, 255, 0.08);
    color: #eee;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .avatar-small {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .input-area {
    display: flex;
    gap: 8px;
    padding: 16px;
    background: rgba(0,0,0,0.15);
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  #message-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }

  #message-input:focus { border-color: #38ef7d; }
  #message-input::placeholder { color: rgba(255,255,255,0.4); }

  #send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #05261e;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
  }

  #send-btn:hover:not(:disabled) { transform: scale(1.08); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .deploy-tag {
    margin-top: 14px;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <h2>Support Assistant</h2>
      <p><span class="status-dot"></span> Online</p>
    </div>
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input id="message-input" placeholder="Type your message..." autocomplete="off" />
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="deploy-tag">v2.0 — teal theme — CI/CD test build</div>

<script>
  const sessionId = "session-" + Math.random().toString(36).substring(2, 10);
  const chatBox = document.getElementById("chat-box");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, sender) {
    const row = document.createElement("div");
    row.className = `msg-row ${sender}`;
    row.innerHTML = `
      <div class="avatar-small">${sender === "user" ? "🧑" : "🤖"}</div>
      <div class="bubble">${text}</div>
    `;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg-row agent";
    row.id = "typing-indicator";
    row.innerHTML = `
      <div class="avatar-small">🤖</div>
      <div class="bubble typing-dots"><span></span><span></span><span></span></div>
    `;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendMessage() {
    const message = messageInput.value.trim();
    if (!message) return;

    addMessage(message, "user");
    messageInput.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: message })
      });

      const data = await response.json();
      removeTyping();
      addMessage(data.reply, "agent");
    } catch (err) {
      removeTyping();
      addMessage("⚠️ Could not reach the server.", "agent");
    }

    sendBtn.disabled = false;
    messageInput.focus();
  }

  messageInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });

  // Welcome message
  addMessage("Hi! How can I help you today? 👋", "agent");
</script>

</body>
</html>
