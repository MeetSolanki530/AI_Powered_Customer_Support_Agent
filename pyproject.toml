[project]
name = "ai-powered-customer-support-agent"
version = "0.1.0"
description = "AI powered customer support agent with memory and tool calling"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "pymongo",
    "mem0ai",
]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"